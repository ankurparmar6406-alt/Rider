<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIDER AI</title>

<style>
body{
margin:0;
background:#000;
color:white;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
width:90%;
max-width:400px;
text-align:center;
padding:20px;
border:2px solid #00bfff;
border-radius:20px;
box-shadow:0 0 20px #00bfff;
}

input{
width:90%;
padding:12px;
margin-top:15px;
border:none;
border-radius:10px;
font-size:16px;
}

button{
margin-top:15px;
padding:12px 25px;
border:none;
border-radius:25px;
background:#00bfff;
color:white;
font-size:18px;
cursor:pointer;
}

#reply{
margin-top:20px;
color:#00ff99;
}
</style>
</head>

<body>

<div class="card">

<h1>🤖 RIDER AI</h1>

<div style="margin:20px 0;">
  <div style="width:80px;height:80px;border-radius:50%;background:#00bfff;margin:auto;box-shadow:0 0 30px #00bfff;"></div>
  <p style="color:#00bfff;margin-top:10px;">🟢 SYSTEM ONLINE</p>
</div>

<div style="margin:15px 0;font-size:50px;">
🔵
</div>

<p style="color:#00bfff;">
System Online
</p>

<p id="status">Welcome Back, Boss</p>

<div id="info" style="color:#00bfff;margin-bottom:15px;">
🕒 Loading Time...
</div>

<button onclick="startRider()">🎤 Start Rider</button>

<button onclick="speakRider()">🔊 Speak</button>
  
<br>

<input id="command" placeholder="Type here...">

<br>

<button onclick="sendCommand()">Send</button>

<br><br>

<button onclick="alert('Voice feature coming soon!')">
🎤 Voice
</button>

<button onclick="alert('Settings coming soon!')">
⚙️ Settings
</button>
  
<div id="reply"></div>

</div>

<script>
function startRider() {
  document.getElementById("status").innerHTML = "🟢 RIDER Listening...";

  if (!('webkitSpeechRecognition' in window)) {
    document.getElementById("reply").innerHTML =
      "❌ Voice recognition is not supported in this browser.";
    return;
  }

  const recognition = new webkitSpeechRecognition();
  recognition.lang = "en-US";

  recognition.onresult = function(event) {
    let text = event.results[0][0].transcript;

    document.getElementById("reply").innerHTML =
      "🎤 You said: " + text;

    let speech = new SpeechSynthesisUtterance("You said " + text);
    speechSynthesis.speak(speech);
  };

  recognition.start();
}

function sendCommand() {
  let text = document.getElementById("command").value;

  document.getElementById("reply").innerHTML =
    "🤖 RIDER: You said - " + text;

  let speech = new SpeechSynthesisUtterance(
    "You said " + text
  );
  speech.lang = "en-US";
  speechSynthesis.speak(speech);
}

function updateTime(){
  const now = new Date();
  document.getElementById("info").innerHTML =
    "🕒 " + now.toLocaleTimeString();
}

setInterval(updateTime,1000);
updateTime();
  
</script>

</body>
</html>
