<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIDER AI</title>

<style>
body{
margin:0;
background:#000;
color:white;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
width:90%;
max-width:400px;
text-align:center;
padding:20px;
border:2px solid #00bfff;
border-radius:20px;
box-shadow:0 0 20px #00bfff;
}

input{
width:90%;
padding:12px;
margin-top:15px;
border:none;
border-radius:10px;
font-size:16px;
}

button{
margin-top:15px;
padding:12px 25px;
border:none;
border-radius:25px;
background:#00bfff;
color:white;
font-size:18px;
cursor:pointer;
}

#reply{
margin-top:20px;
color:#00ff99;
}
</style>
</head>

<body>

<div class="card">

<h1>🤖 RIDER AI</h1>

<div>
🟢 RIDER ONLINE
</div>
  
<div style="margin:20px 0;">
  <div style="width:80px;height:80px;border-radius:50%;background:#00bfff;margin:auto;box-shadow:0 0 30px #00bfff;"></div>
  <p style="color:#00bfff;margin-top:10px;">🟢 SYSTEM ONLINE</p>
</div>

<div style="margin:15px 0;font-size:50px;">
🔵
</div>

<p style="color:#00bfff;">
System Online
</p>

<p id="status">Welcome Back, Boss</p>

<h3 id="welcome">👋 Welcome Back, Boss!</h3>
  
<div id="info" style="color:#00bfff;margin-bottom:15px;">
🕒 Loading Time...
</div>

  
<div id="battery" style="color:#00ff99;">
🔋 Loading Battery...
</div>

  <div id="weather">
🌤️ Ahmedabad: Sunny
</div>
  
<button onclick="startRider()">🎤 Start Rider</button>

<button onclick="speakRider()">🔊 Speak</button>
  
<br>

<input id="command" placeholder="Type here...">

<br>

<button onclick="sendCommand()">Send</button>

<br><br>

<button onclick="alert('Voice feature coming soon!')">
🎤 Voice
</button>

<button onclick="alert('Settings coming soon!')">
⚙️ Settings
</button>

<hr>

<h3>💬 Chat History</h3>

<div id="history">
No messages yet...
</div>
  
<div id="reply"></div>

</div>

<script>
function startRider() {
  document.getElementById("status").innerHTML =
    "🟢 RIDER Listening...";

  if (!("webkitSpeechRecognition" in window)) {
    document.getElementById("reply").innerHTML =
      "❌ Voice recognition supported nahi hai.";
    return;
  }

  const recognition = new webkitSpeechRecognition();

  recognition.lang = "en-IN";
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onresult = async function(event) {
    const text = event.results[0][0].transcript;

    document.getElementById("command").value = text;

    document.getElementById("reply").innerHTML =
      "🎤 You said: " + text;

    await sendCommand();

    document.getElementById("status").innerHTML =
      "🟢 RIDER Online";
  };

  recognition.onerror = function() {
    document.getElementById("status").innerHTML =
      "❌ Voice error";
  };

  recognition.start();
}

async function sendCommand() {
  
  let text = document.getElementById("command").value.trim();
let reply = "";

  if (text.toLowerCase() === "time") {
  let now = new Date();
  reply = "🕒 Boss, abhi time " + now.toLocaleTimeString("en-IN") + " hai.";

  document.getElementById("reply").innerHTML = reply;

  let speech = new SpeechSynthesisUtterance(reply);
  speechSynthesis.speak(speech);

  return;
}

  if (!text) {
    reply = "🤖 Boss, kuch type karo.";
  } else {
    document.getElementById("reply").innerHTML = "🤖 Rider soch raha hai...";

    try {
      const response = await fetch("/.netlify/functions/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: text
        })
      });

      const data = await response.json();
      reply = data.reply || "🤖 Sorry Boss, reply nahi mila.";

    } catch (error) {
      reply = "❌ Boss, connection error aa gaya.";
    }
  }

  document.getElementById("reply").innerHTML = reply;

  document.getElementById("history").innerHTML =
    "👤 " + text + "<br>🤖 " + reply;

  let speech = new SpeechSynthesisUtterance(reply);
  speechSynthesis.speak(speech);
}

function updateTime(){
  const now = new Date();
  document.getElementById("info").innerHTML =
    "🕒 " + now.toLocaleTimeString();
}

setInterval(updateTime,1000);
updateTime();

async function updateBattery() {

  if ('getBattery' in navigator) {

    const battery = await navigator.getBattery();

    function update() {
      document.getElementById("battery").innerHTML =
        "🔋 Battery: " + Math.round(battery.level * 100) + "%";
    }

    update();

    battery.addEventListener("levelchange", update);

  } else {

    document.getElementById("battery").innerHTML =
      "❌ Battery API not supported";

  }

}

updateBattery();
  
function speakRider() {
  let speech = new SpeechSynthesisUtterance("Hello Boss, I am Rider.");
  speechSynthesis.speak(speech);
}
  
</script>

</body>
</html>
