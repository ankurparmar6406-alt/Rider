<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>RIDER AI</title>

<style>

body{
  margin:0;
  background:#000;
  color:white;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.card{
  width:90%;
  max-width:430px;
  text-align:center;
  padding:20px;
  border:2px solid #00bfff;
  border-radius:20px;
  box-shadow:0 0 20px #00bfff;
}

.logo{
  width:80px;
  height:80px;
  margin:20px auto;
  border-radius:50%;
  background:#00bfff;
  box-shadow:0 0 30px #00bfff;
}

input{
  width:90%;
  box-sizing:border-box;
  padding:12px;
  margin-top:15px;
  border:0;
  border-radius:10px;
  font-size:16px;
}

button{
  margin:8px 4px;
  padding:12px 20px;
  border:0;
  border-radius:25px;
  background:#00bfff;
  color:white;
  font-size:16px;
  cursor:pointer;
}

button:active{
  transform:scale(.96);
}

#reply{
  margin-top:20px;
  color:#00ff99;
  line-height:1.5;
  white-space:pre-wrap;
}

#info{
  color:#00bfff;
}

#battery{
  color:#00ff99;
}

#status{
  color:white;
}

#history{
  text-align:left;
  max-height:180px;
  overflow:auto;
  line-height:1.5;
  margin-top:10px;
}

</style>

</head>

<body>

<div class="card">

<h1>🤖 RIDER AI</h1>

<div>🟢 RIDER ONLINE</div>

<div class="logo"></div>

<p id="status">👋 Welcome Back, Boss!</p>

<div id="info">
🕒 Loading Time...
</div>

<div id="battery">
🔋 Loading Battery...
</div>

<div id="weather">
🌤️ Ahmedabad
</div>

<br>

<button onclick="startRider()">
🎤 Start Rider
</button>

<button onclick="speakRider()">
🔊 Speak
</button>

<br>

<input
  id="command"
  placeholder="Boss, kuch bolo..."
>

<br>

<button onclick="sendCommand()">
📤 Send
</button>

<button onclick="openYouTube()">
▶️ YouTube
</button>

<button onclick="openGoogle()">
🌐 Google
</button>

<button onclick="chooseFile()">
📁 File
</button>

<input
  id="fileInput"
  type="file"
  style="display:none"
  onchange="fileSelected()"
>

<hr>

<h3>💬 Chat History</h3>

<div id="history">
No messages yet...
</div>

<div id="reply"></div>

</div>


<script>

/* =====================================
   GLOBAL
===================================== */

let recognition = null;


/* =====================================
   VOICE INPUT
===================================== */

function startRider(){

  document.getElementById("status").innerHTML =
    "🟢 RIDER Listening...";

  document.getElementById("reply").innerHTML =
    "🎤 Boss, boliye...";

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    document.getElementById("status").innerHTML =
      "❌ Voice supported nahi hai.";

    document.getElementById("reply").innerHTML =
      "❌ Is browser me microphone voice recognition available nahi hai.";

    return;
  }

  recognition = new SpeechRecognition();

  recognition.lang = "hi-IN";

  recognition.continuous = false;

  recognition.interimResults = false;

  recognition.onstart = function(){

    document.getElementById("status").innerHTML =
      "🎤 RIDER Sun raha hai...";
  };


  recognition.onresult = async function(event){

    const text =
      event.results[0][0].transcript;

    document.getElementById("command").value =
      text;

    document.getElementById("reply").innerHTML =
      "🎤 You said: " + text;

    await sendCommand();

    document.getElementById("status").innerHTML =
      "🟢 RIDER Online";
  };


  recognition.onerror = function(event){

    document.getElementById("status").innerHTML =
      "❌ Voice Error";

    document.getElementById("reply").innerHTML =
      "❌ Voice error: " +
      event.error +
      "\n\nBoss, browser me microphone permission Allow karo.";
  };


  recognition.onend = function(){

    document.getElementById("status").innerHTML =
      "🟢 RIDER Online";
  };


  try{

    recognition.start();

  }catch(error){

    document.getElementById("reply").innerHTML =
      "❌ Microphone start nahi hua.";
  }

}


/* =====================================
   MAIN COMMAND
===================================== */

async function sendCommand(){

  const input =
    document.getElementById("command");

  const text =
    input.value.trim();

  if(!text){

    showReply(
      "🤖 Boss, kuch bolo."
    );

    return;
  }


  const command =
    text.toLowerCase();


  /* =================================
     TIME
  ================================= */

  if(
    command === "time" ||
    command.includes("time batao") ||
    command.includes("kitna time") ||
    command.includes("samay")
  ){

    const now = new Date();

    const reply =
      "🕒 Boss, abhi time " +
      now.toLocaleTimeString("en-IN") +
      " hai.";

    showReply(reply);

    speak(reply);

    return;
  }


  /* =================================
     DATE
  ================================= */

  if(
    command === "date" ||
    command.includes("date batao") ||
    command.includes("aaj ki date") ||
    command.includes("today")
  ){

    const now = new Date();

    const reply =
      "📅 Boss, aaj ki date " +
      now.toLocaleDateString("en-IN") +
      " hai.";

    showReply(reply);

    speak(reply);

    return;
  }


  /* =================================
     YOUTUBE
  ================================= */

  if(
    command === "youtube" ||
    command.includes("youtube kholo") ||
    command.includes("youtube open")
  ){

    openYouTube();

    const reply =
      "▶️ Boss, YouTube khol raha hoon.";

    showReply(reply);

    speak(reply);

    return;
  }


  /* =================================
     GOOGLE
  ================================= */

  if(
    command === "google" ||
    command.includes("google kholo") ||
    command.includes("google open")
  ){

    openGoogle();

    const reply =
      "🌐 Boss, Google khol raha hoon.";

    showReply(reply);

    speak(reply);

    return;
  }


  /* =================================
     FILE
  ================================= */

  if(
    command.includes("file") ||
    command.includes("photo select") ||
    command.includes("video select")
  ){

    chooseFile();

    const reply =
      "📁 Boss, file select karo.";

    showReply(reply);

    speak(reply);

    return;
  }


  /* =================================
     RESEARCH
  ================================= */

  if(
    command.includes("research") ||
    command.includes("research karo") ||
    command.includes("research kar") ||
    command.includes("search karo") ||
    command.includes("internet par") ||
    command.includes("internet pe") ||
    command.includes("latest news") ||
    command.includes("latest information")
  ){

    document.getElementById("reply").innerHTML =
      "🔎 Boss, internet par research kar raha hoon...";

    document.getElementById("status").innerHTML =
      "🔎 RIDER Researching...";


    try{

      const response =
        await fetch(
          "/.netlify/functions/research",
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:JSON.stringify({
              query:text
            })
          }
        );


      const data =
        await response.json();


      const reply =
        data.reply ||
        "❌ Boss, research result nahi mila.";


      showReply(reply);

      speak(reply);


    }catch(error){

      showReply(
        "❌ Boss, research service connect nahi ho rahi."
      );

    }


    document.getElementById("status").innerHTML =
      "🟢 RIDER Online";

    return;
  }


  /* =================================
     NORMAL AI CHAT
  ================================= */

  document.getElementById("status").innerHTML =
    "🤖 RIDER Thinking...";

  document.getElementById("reply").innerHTML =
    "🤖 Rider soch raha hai...";


  try{

    const response =
      await fetch(
        "/.netlify/functions/chat",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            message:text
          })
        }
      );


    const data =
      await response.json();


    const reply =
      data.reply ||
      "🤖 Boss, reply nahi mila.";


    showReply(reply);

    speak(reply);


  }catch(error){

    showReply(
      "❌ Boss, connection error aa gaya."
    );

  }


  document.getElementById("status").innerHTML =
    "🟢 RIDER Online";

}


/* =====================================
   SHOW REPLY
===================================== */

function showReply(reply){

  document.getElementById("reply").innerHTML =
    escapeHtml(reply);


  const text =
    document.getElementById("command").value;


  document.getElementById("history").innerHTML =
    "👤 " +
    escapeHtml(text) +
    "<br><br>" +
    "🤖 " +
    escapeHtml(reply);
}


/* =====================================
   VOICE OUTPUT
===================================== */

function speak(text){

  if(
    !("speechSynthesis" in window)
  ){

    return;
  }


  speechSynthesis.cancel();


  const speech =
    new SpeechSynthesisUtterance(
      text
    );


  speech.lang =
    "hi-IN";

  speech.rate =
    0.92;

  speech.pitch =
    1;


  speech.onstart =
    function(){

      document.getElementById("status").innerHTML =
        "🔊 RIDER Bol raha hai...";
    };


  speech.onend =
    function(){

      document.getElementById("status").innerHTML =
        "🟢 RIDER Online";
    };


  speechSynthesis.speak(
    speech
  );

}


/* =====================================
   RIDER SPEAK BUTTON
===================================== */

function speakRider(){

  speak(
    "Hello Boss. Main RIDER AI hoon. Aap jo poochna chahte hain, pooch sakte hain."
  );

}


/* =====================================
   YOUTUBE
===================================== */

function openYouTube(){

  window.open(
    "https://www.youtube.com",
    "_blank"
  );

}


/* =====================================
   GOOGLE
===================================== */

function openGoogle(){

  window.open(
    "https://www.google.com",
    "_blank"
  );

}


/* =====================================
   FILE
===================================== */

function chooseFile(){

  document
    .getElementById("fileInput")
    .click();

}


function fileSelected(){

  const file =
    document
      .getElementById("fileInput")
      .files[0];


  if(!file){

    return;
  }


  const reply =
    "📁 Boss, file select ho gayi:\n" +
    file.name;


  showReply(reply);

  speak(
    "Boss, file select ho gayi."
  );

}


/* =====================================
   LIVE TIME
===================================== */

function updateTime(){

  const now =
    new Date();


  document.getElementById("info").innerHTML =
    "🕒 " +
    now.toLocaleTimeString(
      "en-IN"
    );

}


setInterval(
  updateTime,
  1000
);

updateTime();


/* =====================================
   BATTERY
===================================== */

async function updateBattery(){

  if(
    !("getBattery" in navigator)
  ){

    document.getElementById("battery").innerHTML =
      "🔋 Battery information unavailable";

    return;
  }


  try{

    const battery =
      await navigator.getBattery();


    function update(){

      document.getElementById("battery").innerHTML =
        "🔋 Battery: " +
        Math.round(
          battery.level * 100
        ) +
        "%";
    }


    update();


    battery.addEventListener(
      "levelchange",
      update
    );


  }catch(error){

    document.getElementById("battery").innerHTML =
      "🔋 Battery unavailable";
  }

}


updateBattery();


/* =====================================
   HTML SAFETY
===================================== */

function escapeHtml(text){

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>
</html>
