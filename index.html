<script>
function startRider() {
  const reply = document.getElementById("reply");

  reply.innerHTML = "🎤 Listening...";

  if (!('webkitSpeechRecognition' in window)) {
    reply.innerHTML = "❌ Voice recognition is not supported in this browser.";
    return;
  }

  const recognition = new webkitSpeechRecognition();
  recognition.lang = "en-IN";
  recognition.start();

  recognition.onresult = function(event) {
    const text = event.results[0][0].transcript;

    reply.innerHTML =
      "<b>You:</b> " + text +
      "<br><br><b>RIDER:</b> I heard you say: " + text;

    const speech = new SpeechSynthesisUtterance("You said " + text);
    speech.lang = "en-IN";
    speechSynthesis.speak(speech);
  };

  recognition.onerror = function() {
    reply.innerHTML = "⚠️ I couldn't hear you. Please try again.";
  };
}
</script>
